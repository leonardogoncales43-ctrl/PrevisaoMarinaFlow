name: Atualizar Previsao Maritima

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar bibliotecas
        run: pip install -r requirements.txt

      - name: Rodar o script
        run: python previsao.py

      - name: Salvar o JSON
        run: |
          git config --global user.name "Bot do PI"
          git config --global user.email "actions@github.com"
          git add previsao_sao_sebastiao.json
          git commit -m "Auto: Atualiza previsão" || echo "Sem mudanças"
          git push